<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihal's Website</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      background-color: #f4f7fe; 
    }
    .card { 
      background-color: white; 
      padding: 35px 30px; 
      border-radius: 12px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
      text-align: center; 
      width: 320px; 
    }
    h2 { 
      margin-top: 0;
      margin-bottom: 20px; 
      color: #2b3674; 
      font-size: 22px;
    }
    input[type="text"] { 
      width: 100%; 
      padding: 12px; 
      margin-bottom: 12px; 
      border: 1px solid #e0e5f2; 
      border-radius: 8px; 
      box-sizing: border-box; 
      outline: none;
      font-size: 14px;
    }
    input[type="text"]:focus {
      border-color: #4318ff;
    }
    .btn { 
      width: 100%; 
      padding: 12px; 
      background-color: #4318ff; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 15px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn:hover { 
      background-color: #3311cc; 
    }
    p.warning { 
      color: #e31a1a; 
      font-size: 12px; 
      margin-top: 15px; 
      line-height: 1.4;
    }
    .hidden {
      display: none;
    }
    .success-icon {
      font-size: 45px;
      color: #05cd99;
      margin-bottom: 10px;
    }
    .enter-link {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background-color: #05cd99;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      box-sizing: border-box;
    }
    .enter-link:hover {
      background-color: #04b083;
    }
  </style>
</head>
<body>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {showSuccess();}"></iframe>

  <!-- Step 1: Input Form -->
  <div class="card" id="form-card">
    <h2>Enter Your Name</h2>
    <form action="https://docs.google.com/forms/d/e/1FAIpQLSeKM-Pdncqrck4bR-AxPM3Q-dBIVzEd-2S5Dc1GXeY77R-oQg/formResponse" 
          method="POST" 
          target="hidden_iframe" 
          onsubmit="submitted=true;">
      
      <input type="text" placeholder="Your Name" name="entry.399564637" required>
      <p class="warning">* If you don't submit your name, you won't be able to view Nihal's website.</p>
      <button type="submit" class="btn">Submit & Enter</button>
    </form>
  </div>

  <!-- Step 2: Success Message (Hidden by default) -->
  <div class="card hidden" id="success-card">
    <div class="success-icon">✓</div>
    <h2>Thank You!</h2>
    <p style="color: #707ebe; font-size: 14px; margin-bottom: 20px;">Your entry has been recorded.</p>
    <a href="https://nlnihalahmed-afk.github.io/nlnihalahmed-afk/Main.html" class="enter-link">Click Here to Enter Website</a>

  </div>

  <script>
    var submitted = false;
    function showSuccess() {
      document.getElementById('form-card').classList.add('hidden');
      document.getElementById('success-card').classList.remove('hidden');
    }
  </script>

</body>
</html>
