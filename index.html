<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Name Input</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
    .form-container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
    h2 { margin-top: 0; color: #333; }
    input[type="text"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .warning { color: red; font-size: 12px; margin-bottom: 15px; text-align: center; display: block; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Enter Your Name</h2>
    <form action="https://script.google.com/macros/s/AKfycbyRagTKkkjOXdbm5i_vA7uDMFXoFohIjQsY3lMeFXI/exec" method="POST">
      <input type="text" name="userName" placeholder="Your Name" required>
      <span class="warning">*IMPORTANT* If you don't submit your name, you won't be able to view Nihal's website.</span>
      <button type="submit">Submit & Enter</button>
    </form>
  </div>

</body>
</html>
