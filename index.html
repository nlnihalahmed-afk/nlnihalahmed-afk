<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h2 { margin-top: 0; margin-bottom: 20px; color: #333; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .warning { color: black; font-size: 14px; margin-bottom: 20px; text-align: center; display: block; }
        .asterisk { color: red; font-weight: bold; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Enter Your Name</h2>
        <form id="userForm">
            <input type="text" id="userName" placeholder="Your Name" required>
            <span class="warning">
                <span class="asterisk">*</span> If you don't write your name, you won't be able to see Nihal's website.
            </span>
            <button type="submit">Submit & Enter</button>
        </form>
    </div>

    <script>
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            
            console.log("User Name:", name);
            window.location.href = "https://nlnihalahmed-afk.github.io/nlnihalahmed-afk/Main.html";
        });
    </script>
</body>
</html>
